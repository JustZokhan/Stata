
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>СТАТИСТИКА</title></head>
<body>
<h1>СТАТИСТИКА</h1>
<div id="table-container"></div>
{% if user == 'admin' %}
<form id="add-form">
    <input type="text" name="name" placeholder="Имя" required>
    <input type="number" name="cash" placeholder="Кэш" required>
    <button type="submit">Добавить</button>
</form>
{% endif %}
<script>
async function loadData() {
    const r = await fetch("/data");
    const d = await r.json();
    let h = "<table border=1><tr><th>Место</th><th>Имя</th><th>Кэш</th><th>Баллы</th>{% if user == 'admin' %}<th>Удалить</th><th>Редактировать</th>{% endif %}</tr>";
    d.forEach(u => {
        h += `<tr><td>${u.place}</td><td>${u.name}</td><td>${u.cash}</td><td>${u.points}</td>
        {% if user == 'admin' %}
        <td><button onclick="deleteItem(${u.id})">Удалить</button></td>
        <td><form onsubmit="return editItem(${u.id})">
            <input id="n${u.id}" value="${u.name}"><input id="c${u.id}" value="${u.cash}" type="number">
            <button>Сохранить</button></form></td>{% endif %}</tr>`;
    });
    h += "</table>";
    document.getElementById("table-container").innerHTML = h;
}
{% if user == 'admin' %}
document.getElementById("add-form").addEventListener("submit", async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    await fetch("/add", {method: "POST", body: f});
    e.target.reset(); loadData();
});
async function deleteItem(id) {
    const f = new FormData(); f.append("staff_id", id);
    await fetch("/delete", {method: "POST", body: f});
    loadData(); return false;
}
async function editItem(id) {
    const f = new FormData();
    f.append("staff_id", id);
    f.append("name", document.getElementById("n" + id).value);
    f.append("cash", document.getElementById("c" + id).value);
    await fetch("/edit", {method: "POST", body: f});
    loadData(); return false;
}
{% endif %}
loadData();
</script>
</body></html>
