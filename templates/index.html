
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>СТАТИСТИКА</title>
</head>
<body>
<script>
function toRoman(n) {
    const map = [
        ["M", 1000], ["CM", 900], ["D", 500], ["CD", 400],
        ["C", 100], ["XC", 90], ["L", 50], ["XL", 40],
        ["X", 10], ["IX", 9], ["V", 5], ["IV", 4], ["I", 1]
    ];
    let result = "";
    for (let [roman, value] of map) {
        while (n >= value) {
            result += roman;
            n -= value;
        }
    }
    return result;
}
</script>
</body>
</html>
